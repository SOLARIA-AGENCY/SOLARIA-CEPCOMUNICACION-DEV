name: 📊 System Monitoring & Health Checks

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      full_monitoring:
        description: 'Run full monitoring suite (including performance tests)'
        required: false
        default: 'false'
        type: boolean

env:
  PRODUCTION_URL: https://www.cepcomunicacion.com
  API_URL: https://api.cepcomunicacion.com

jobs:
  health-checks:
    name: 🏥 Health Checks
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔍 Frontend Health Check
        run: |
          echo "## 🏥 System Health Report" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check main frontend
          echo "### 🌐 Frontend Status" >> $GITHUB_STEP_SUMMARY
          
          frontend_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.PRODUCTION_URL }} || echo "000")
          response_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 ${{ env.PRODUCTION_URL }} || echo "timeout")
          
          if [ "$frontend_status" = "200" ]; then
            echo "- ✅ **Frontend**: Online (HTTP $frontend_status)" >> $GITHUB_STEP_SUMMARY
            echo "- ⏱️ **Response Time**: ${response_time}s" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Frontend**: Down (HTTP $frontend_status)" >> $GITHUB_STEP_SUMMARY
            echo "::error::Frontend is down with status code $frontend_status"
          fi
          
      - name: 🔌 API Health Check
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔌 API Status" >> $GITHUB_STEP_SUMMARY
          
          # Check API health endpoint
          api_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.API_URL }}/health || echo "000")
          api_response_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 ${{ env.API_URL }}/health || echo "timeout")
          
          if [ "$api_status" = "200" ]; then
            # Get API response content
            api_response=$(curl -s --max-time 30 ${{ env.API_URL }}/health || echo "no response")
            echo "- ✅ **API**: Online (HTTP $api_status)" >> $GITHUB_STEP_SUMMARY
            echo "- ⏱️ **Response Time**: ${api_response_time}s" >> $GITHUB_STEP_SUMMARY
            echo "- 📊 **Health Data**: \`$api_response\`" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **API**: Down (HTTP $api_status)" >> $GITHUB_STEP_SUMMARY
            echo "::error::API is down with status code $api_status"
          fi
          
  ssl-monitoring:
    name: 🔒 SSL Certificate Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔒 Check SSL Certificates
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔒 SSL Certificate Status" >> $GITHUB_STEP_SUMMARY
          
          # Function to check SSL certificate
          check_ssl() {
            local domain=$1
            local url=$2
            
            echo "Checking SSL for $domain..."
            
            # Get certificate expiry date
            if command -v openssl >/dev/null 2>&1; then
              expiry_date=$(echo | timeout 10 openssl s_client -servername $domain -connect $domain:443 2>/dev/null | openssl x509 -noout -dates 2>/dev/null | grep notAfter | cut -d= -f2)
              
              if [ -n "$expiry_date" ]; then
                # Calculate days until expiry
                expiry_epoch=$(date -d "$expiry_date" +%s 2>/dev/null || date -j -f "%b %d %H:%M:%S %Y %Z" "$expiry_date" +%s 2>/dev/null || echo "0")
                current_epoch=$(date +%s)
                days_left=$(( (expiry_epoch - current_epoch) / 86400 ))
                
                if [ $days_left -gt 30 ]; then
                  echo "- ✅ **$domain**: Valid ($days_left days remaining)" >> $GITHUB_STEP_SUMMARY
                elif [ $days_left -gt 7 ]; then
                  echo "- ⚠️ **$domain**: Expires soon ($days_left days remaining)" >> $GITHUB_STEP_SUMMARY
                  echo "::warning::SSL certificate for $domain expires in $days_left days"
                else
                  echo "- ❌ **$domain**: Critical - expires in $days_left days" >> $GITHUB_STEP_SUMMARY
                  echo "::error::SSL certificate for $domain expires in $days_left days"
                fi
              else
                echo "- ❌ **$domain**: Cannot verify certificate" >> $GITHUB_STEP_SUMMARY
              fi
            else
              echo "- ⚠️ **$domain**: OpenSSL not available for verification" >> $GITHUB_STEP_SUMMARY
            fi
          }
          
          # Check both domains
          check_ssl "www.cepcomunicacion.com" "${{ env.PRODUCTION_URL }}"
          check_ssl "api.cepcomunicacion.com" "${{ env.API_URL }}"
          
  performance-monitoring:
    name: ⚡ Performance Monitoring
    runs-on: ubuntu-latest
    if: github.event.inputs.full_monitoring == 'true' || github.event_name == 'schedule'
    
    steps:
      - name: ⚡ Performance Tests
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### ⚡ Performance Metrics" >> $GITHUB_STEP_SUMMARY
          
          # Frontend performance
          echo "#### 🌐 Frontend Performance" >> $GITHUB_STEP_SUMMARY
          frontend_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 ${{ env.PRODUCTION_URL }} || echo "timeout")
          frontend_size=$(curl -s -w "%{size_download}" -o /dev/null ${{ env.PRODUCTION_URL }} || echo "0")
          
          echo "- **Load Time**: ${frontend_time}s" >> $GITHUB_STEP_SUMMARY
          echo "- **Page Size**: $((frontend_size / 1024))KB" >> $GITHUB_STEP_SUMMARY
          
          # API performance
          echo "#### 🔌 API Performance" >> $GITHUB_STEP_SUMMARY
          api_time=$(curl -s -o /dev/null -w "%{time_total}" --max-time 30 ${{ env.API_URL }}/health || echo "timeout")
          
          echo "- **API Response Time**: ${api_time}s" >> $GITHUB_STEP_SUMMARY
          
          # Performance warnings
          if [ "$frontend_time" != "timeout" ] && (( $(echo "$frontend_time > 3.0" | bc -l) )); then
            echo "::warning::Frontend load time is slow: ${frontend_time}s"
          fi
          
          if [ "$api_time" != "timeout" ] && (( $(echo "$api_time > 1.0" | bc -l) )); then
            echo "::warning::API response time is slow: ${api_time}s"
          fi
          
  dns-monitoring:
    name: 🌐 DNS & Network Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: 🌐 DNS Resolution Check
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🌐 DNS Resolution Status" >> $GITHUB_STEP_SUMMARY
          
          # Check DNS resolution
          check_dns() {
            local domain=$1
            local expected_type=$2
            
            if command -v dig >/dev/null 2>&1; then
              result=$(dig +short $domain 2>/dev/null)
              if [ -n "$result" ]; then
                echo "- ✅ **$domain**: $result" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ❌ **$domain**: DNS resolution failed" >> $GITHUB_STEP_SUMMARY
                echo "::error::DNS resolution failed for $domain"
              fi
            else
              result=$(nslookup $domain 2>/dev/null | grep -A 1 "Name:" | tail -1 | grep "Address:" | cut -d' ' -f2)
              if [ -n "$result" ]; then
                echo "- ✅ **$domain**: $result" >> $GITHUB_STEP_SUMMARY
              else
                echo "- ❌ **$domain**: DNS resolution failed" >> $GITHUB_STEP_SUMMARY
              fi
            fi
          }
          
          check_dns "www.cepcomunicacion.com" "A"
          check_dns "api.cepcomunicacion.com" "A"
          
  endpoint-monitoring:
    name: 🔗 Endpoint Monitoring
    runs-on: ubuntu-latest
    
    steps:
      - name: 🔗 Test Critical Endpoints
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Critical Endpoints Status" >> $GITHUB_STEP_SUMMARY
          
          # Test API endpoints
          echo "#### 🔌 API Endpoints" >> $GITHUB_STEP_SUMMARY
          
          # Health endpoint
          health_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.API_URL }}/health || echo "000")
          if [ "$health_status" = "200" ]; then
            echo "- ✅ **GET /health**: $health_status" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **GET /health**: $health_status" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Form proxy endpoint (POST test)
          proxy_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Content-Type: application/json" \
            -d '{"test":"monitoring"}' \
            --max-time 30 ${{ env.API_URL }}/api/formsubmit-proxy || echo "000")
          
          if [ "$proxy_status" = "200" ] || [ "$proxy_status" = "400" ]; then
            echo "- ✅ **POST /api/formsubmit-proxy**: $proxy_status (endpoint accessible)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **POST /api/formsubmit-proxy**: $proxy_status" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Test Frontend critical paths
          echo "#### 🌐 Frontend Endpoints" >> $GITHUB_STEP_SUMMARY
          
          # Main page
          main_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.PRODUCTION_URL }} || echo "000")
          echo "- $([ "$main_status" = "200" ] && echo "✅" || echo "❌") **Main Page**: $main_status" >> $GITHUB_STEP_SUMMARY
          
          # Course page sample
          course_status=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 ${{ env.PRODUCTION_URL }}/cursos/quiromasaje-nivel2-norte || echo "000")
          echo "- $([ "$course_status" = "200" ] && echo "✅" || echo "❌") **Course Page**: $course_status" >> $GITHUB_STEP_SUMMARY
          
  monitoring-summary:
    name: 📋 Monitoring Summary
    runs-on: ubuntu-latest
    needs: [health-checks, ssl-monitoring, performance-monitoring, dns-monitoring, endpoint-monitoring]
    if: always()
    
    steps:
      - name: 📋 Generate Monitoring Report
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "---" >> $GITHUB_STEP_SUMMARY
          echo "## 📊 Monitoring Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Overall status
          echo "### 🎯 Overall Status" >> $GITHUB_STEP_SUMMARY
          
          all_success=true
          
          # Check each job result
          if [ "${{ needs.health-checks.result }}" != "success" ]; then
            echo "- ❌ **Health Checks**: Failed" >> $GITHUB_STEP_SUMMARY
            all_success=false
          else
            echo "- ✅ **Health Checks**: Passed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.ssl-monitoring.result }}" != "success" ]; then
            echo "- ❌ **SSL Monitoring**: Failed" >> $GITHUB_STEP_SUMMARY
            all_success=false
          else
            echo "- ✅ **SSL Monitoring**: Passed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.dns-monitoring.result }}" != "success" ]; then
            echo "- ❌ **DNS Monitoring**: Failed" >> $GITHUB_STEP_SUMMARY
            all_success=false
          else
            echo "- ✅ **DNS Monitoring**: Passed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.endpoint-monitoring.result }}" != "success" ]; then
            echo "- ❌ **Endpoint Monitoring**: Failed" >> $GITHUB_STEP_SUMMARY
            all_success=false
          else
            echo "- ✅ **Endpoint Monitoring**: Passed" >> $GITHUB_STEP_SUMMARY
          fi
          
          if [ "${{ needs.performance-monitoring.result }}" != "success" ] && [ "${{ needs.performance-monitoring.result }}" != "skipped" ]; then
            echo "- ❌ **Performance Monitoring**: Failed" >> $GITHUB_STEP_SUMMARY
            all_success=false
          elif [ "${{ needs.performance-monitoring.result }}" = "success" ]; then
            echo "- ✅ **Performance Monitoring**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⏭️ **Performance Monitoring**: Skipped" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          
          if [ "$all_success" = "true" ]; then
            echo "🎉 **All systems operational!**" >> $GITHUB_STEP_SUMMARY
          else
            echo "⚠️ **Some issues detected. Please review above.**" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Monitoring completed at:** $(date)" >> $GITHUB_STEP_SUMMARY
          echo "**Next scheduled check:** $(date -d '+1 hour')" >> $GITHUB_STEP_SUMMARY