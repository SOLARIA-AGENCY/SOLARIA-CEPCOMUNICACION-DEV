name: Staging Deployment

on:
  push:
    branches: [ staging ]
  workflow_run:
    workflows: ["Development CI Pipeline"]
    types:
      - completed
    branches: [ staging ]

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'push' }}
    
    environment:
      name: staging
      url: https://staging.cepformacion.com
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20.x'
        cache: 'npm'
    
    - name: Install dependencies
      run: npm ci
    
    - name: Build for staging
      run: |
        npm run build
      env:
        VITE_APP_ENV: staging
        VITE_API_URL: https://staging-api.cepformacion.com
    
    - name: Deploy to staging server
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.STAGING_HOST }}
        username: ${{ secrets.STAGING_USER }}
        key: ${{ secrets.STAGING_SSH_KEY }}
        script: |
          cd /var/www/staging.cepformacion.com
          git pull origin staging
          npm ci --production
          npm run build
          sudo systemctl reload nginx
    
    - name: Run staging health checks
      run: |
        sleep 30
        curl -f https://staging.cepformacion.com/health || exit 1
        curl -f https://staging.cepformacion.com/api/status || exit 1
    
    - name: Run E2E tests on staging
      run: |
        npm install -g playwright
        npx playwright install
        npm run test:e2e:staging
      env:
        PLAYWRIGHT_BASE_URL: https://staging.cepformacion.com
    
    - name: Notify staging deployment
      if: success()
      run: |
        echo "🚀 Staging deployment successful!"
        echo "URL: https://staging.cepformacion.com"
        echo "Ready for QA testing and production sync."
    
    - name: Notify deployment failure
      if: failure()
      run: |
        echo "❌ Staging deployment failed!"
        echo "Please check logs and fix issues before retrying."
        exit 1