name: Production Sync

on:
  workflow_run:
    workflows: ["Staging Deployment"]
    types:
      - completed
    branches: [ staging ]
  
  # Manual trigger for emergency releases
  workflow_dispatch:
    inputs:
      force_sync:
        description: 'Force sync to production (use with caution)'
        required: false
        default: 'false'
        type: choice
        options:
        - 'false'
        - 'true'

jobs:
  create-production-pr:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event.inputs.force_sync == 'true' }}
    
    steps:
    - name: Checkout dev repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.PROD_SYNC_TOKEN }}
        fetch-depth: 0
    
    - name: Setup Git
      run: |
        git config --global user.name "ECO-NAZCAMEDIA Bot"
        git config --global user.email "dev@solaria.agency"
    
    - name: Add production remote
      run: |
        git remote add production https://${{ secrets.PROD_SYNC_TOKEN }}@github.com/SOLARIA-AGENCY/solaria-cepcomunicacion.git
        git fetch production
    
    - name: Create sync branch
      run: |
        TIMESTAMP=$(date +"%Y%m%d-%H%M%S")
        BRANCH_NAME="sync/staging-to-prod-${TIMESTAMP}"
        echo "SYNC_BRANCH=${BRANCH_NAME}" >> $GITHUB_ENV
        
        git checkout -b $BRANCH_NAME staging
        git push production $BRANCH_NAME
    
    - name: Get commit messages for PR body
      id: commits
      run: |
        COMMITS=$(git log production/main..staging --oneline --no-merges | head -20)
        echo "COMMIT_LIST<<EOF" >> $GITHUB_OUTPUT
        echo "$COMMITS" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT
    
    - name: Create Pull Request to Production
      uses: actions/github-script@v7
      with:
        github-token: ${{ secrets.PROD_SYNC_TOKEN }}
        script: |
          const { data: pr } = await github.rest.pulls.create({
            owner: 'SOLARIA-AGENCY',
            repo: 'solaria-cepcomunicacion',
            title: `🚀 Production Release - ${new Date().toISOString().split('T')[0]}`,
            head: process.env.SYNC_BRANCH,
            base: 'main',
            body: `## 🚀 Automated Production Sync
            
            **Source:** \`staging\` branch from solaria-cepcomunicacion-dev
            **Target:** \`main\` branch in production repository
            **Triggered by:** Successful staging deployment
            
            ### 📋 Changes included:
            \`\`\`
            ${{ steps.commits.outputs.COMMIT_LIST }}
            \`\`\`
            
            ### ✅ Pre-deployment validations:
            - [x] All tests passed in development
            - [x] Staging deployment successful
            - [x] E2E tests passed on staging
            - [x] Performance metrics validated
            
            ### 🔍 Manual QA Required:
            - [ ] Visual regression testing
            - [ ] Cross-browser compatibility
            - [ ] Mobile responsiveness
            - [ ] Form functionality validation
            
            **⚠️ This PR will trigger production deployment upon merge.**
            
            ---
            *Generated automatically by ECO-NAZCAMEDIA CI/CD Pipeline*`,
            draft: false
          });
          
          console.log(`Created PR #${pr.number}: ${pr.html_url}`);
          
          // Add reviewers
          await github.rest.pulls.requestReviewers({
            owner: 'SOLARIA-AGENCY',
            repo: 'solaria-cepcomunicacion',
            pull_number: pr.number,
            reviewers: ['nazcamedia'] // Add other reviewers as needed
          });
    
    - name: Notify PR creation
      run: |
        echo "✅ Production sync PR created successfully!"
        echo "Branch: ${{ env.SYNC_BRANCH }}"
        echo "Please review and approve the PR for production deployment."

  notify-failure:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    
    steps:
    - name: Notify sync failure
      run: |
        echo "❌ Production sync failed!"
        echo "Staging deployment was unsuccessful. Fix issues before syncing to production."
        exit 1