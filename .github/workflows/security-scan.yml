name: 🛡️ Security Scan & Audit

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    # Run security scan daily at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  NODE_VERSION: '20'

jobs:
  security-audit:
    name: 🔍 Security Audit
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: 🛡️ Run NPM Audit
        run: |
          echo "## 🔍 NPM Security Audit Results" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          npm audit --audit-level high || true
          echo "```" >> $GITHUB_STEP_SUMMARY
          
      - name: 🔒 Check for Vulnerabilities
        run: |
          echo "Checking for high/critical vulnerabilities..."
          if npm audit --audit-level high --parseable | grep -q "high\|critical"; then
            echo "❌ High/Critical vulnerabilities found!"
            npm audit --audit-level high
            exit 1
          else
            echo "✅ No high/critical vulnerabilities found"
          fi
          
  dependency-review:
    name: 📋 Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔍 Dependency Review
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          
  codeql-analysis:
    name: 🔬 CodeQL Analysis
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
      
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔬 Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript,typescript
          
      - name: 🔧 Autobuild
        uses: github/codeql-action/autobuild@v3
        
      - name: 🔍 Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"
          
  secrets-scan:
    name: 🔐 Secrets Detection
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          
      - name: 🔍 Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --debug --only-verified
          
  security-headers:
    name: 🛡️ Security Headers Check
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 🔧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          
      - name: 🔍 Check Security Headers
        run: |
          echo "## 🛡️ Security Headers Analysis" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Check production site security headers
          if command -v curl >/dev/null 2>&1; then
            echo "### 🌐 Production Site Headers" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            curl -I https://www.cepcomunicacion.com 2>/dev/null | grep -E "(X-|Content-Security|Strict-Transport)" || echo "No security headers found" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            
            echo "### 🔌 API Security Headers" >> $GITHUB_STEP_SUMMARY  
            echo "```" >> $GITHUB_STEP_SUMMARY
            curl -I https://api.cepcomunicacion.com/health 2>/dev/null | grep -E "(X-|Content-Security|Strict-Transport)" || echo "No security headers found" >> $GITHUB_STEP_SUMMARY
            echo "```" >> $GITHUB_STEP_SUMMARY
          fi
          
  license-check:
    name: 📜 License Compliance
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        
      - name: 📦 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          
      - name: 🔧 Install Dependencies
        run: npm ci --legacy-peer-deps
        
      - name: 📜 Check Licenses
        run: |
          echo "## 📜 License Compliance Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          
          # Install license checker
          npm install -g license-checker
          
          echo "### 📋 Dependency Licenses" >> $GITHUB_STEP_SUMMARY
          echo "```" >> $GITHUB_STEP_SUMMARY
          license-checker --onlyAllow 'MIT;Apache-2.0;BSD-2-Clause;BSD-3-Clause;ISC;Unlicense;0BSD' --summary 2>/dev/null || true
          echo "```" >> $GITHUB_STEP_SUMMARY
          
  security-report:
    name: 📊 Security Report Summary
    runs-on: ubuntu-latest
    needs: [security-audit, codeql-analysis, secrets-scan, security-headers, license-check]
    if: always()
    
    steps:
      - name: 📊 Generate Security Report
        run: |
          echo "## 🛡️ Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📋 Scan Results" >> $GITHUB_STEP_SUMMARY
          
          # Security Audit
          if [ "${{ needs.security-audit.result }}" = "success" ]; then
            echo "- ✅ **NPM Security Audit**: Passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **NPM Security Audit**: Failed" >> $GITHUB_STEP_SUMMARY
          fi
          
          # CodeQL Analysis
          if [ "${{ needs.codeql-analysis.result }}" = "success" ]; then
            echo "- ✅ **CodeQL Analysis**: No issues found" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **CodeQL Analysis**: Issues detected" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Secrets Scan
          if [ "${{ needs.secrets-scan.result }}" = "success" ]; then
            echo "- ✅ **Secrets Detection**: Clean" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ❌ **Secrets Detection**: Potential secrets found" >> $GITHUB_STEP_SUMMARY
          fi
          
          # Security Headers
          if [ "${{ needs.security-headers.result }}" = "success" ]; then
            echo "- ✅ **Security Headers**: Configured" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **Security Headers**: Needs attention" >> $GITHUB_STEP_SUMMARY
          fi
          
          # License Check
          if [ "${{ needs.license-check.result }}" = "success" ]; then
            echo "- ✅ **License Compliance**: Compliant" >> $GITHUB_STEP_SUMMARY
          else
            echo "- ⚠️ **License Compliance**: Review needed" >> $GITHUB_STEP_SUMMARY
          fi
          
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 🔗 Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "- Review any failed checks above" >> $GITHUB_STEP_SUMMARY
          echo "- Check Security tab for CodeQL alerts" >> $GITHUB_STEP_SUMMARY
          echo "- Monitor dependency updates regularly" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Scan completed at:** $(date)" >> $GITHUB_STEP_SUMMARY