# ================================================================
# CONFIGURACIÓN NGINX PARA API CEPCOMUNICACION.COM
# Reverse proxy para backend NodeMailer en VPS Hostinger
# ================================================================

server {
    listen 80;
    server_name api.cepcomunicacion.com;

    # Redirección HTTPS (se configurará después con Let's Encrypt)
    # return 301 https://$server_name$request_uri;

    # Configuración temporal para HTTP (desarrollo)
    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Headers CORS para frontend
        add_header 'Access-Control-Allow-Origin' 'https://www.cepcomunicacion.com' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization' always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;

        # Manejar preflight requests
        if ($request_method = 'OPTIONS') {
            add_header 'Access-Control-Allow-Origin' 'https://www.cepcomunicacion.com';
            add_header 'Access-Control-Allow-Methods' 'GET, POST, OPTIONS';
            add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization';
            add_header 'Access-Control-Max-Age' 1728000;
            add_header 'Content-Type' 'text/plain; charset=utf-8';
            add_header 'Content-Length' 0;
            return 204;
        }
    }

    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3001/health;
        access_log off;
    }

    # Logs específicos para API
    access_log /var/log/nginx/cepapi_access.log;
    error_log /var/log/nginx/cepapi_error.log;
}

