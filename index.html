    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}

        'analytics_storage': 'denied'
      });
      
      gtag('js', new Date());
      gtag('config', 'G-347NGFNZ90');
    </script>

    <!-- Cookie Consent CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.css" />
    
    <!-- Meta Pixel Code -->
    <script>
      function activateFacebookPixel() {
        !function(f,b,e,v,n,t,s){
          if(f.fbq)return;n=f.fbq=function(){
            n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)};
          if(!f._fbq)f._fbq=n;
          n.push=n; n.loaded=!0; n.version='2.0';
          n.queue=[]; t=b.createElement(e); t.async=!0;
          t.src=v; s=b.getElementsByTagName(e)[0];
          s.parentNode.insertBefore(t,s)
        }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
        fbq('init', '1189071876088388');
        fbq('track', 'PageView');
      }
      
      // Función para actualizar el consentimiento de Google
      function updateGoogleConsent(granted) {
        if (typeof gtag !== 'undefined') {
          gtag('consent', 'update', {
            'ad_storage': granted ? 'granted' : 'denied',
            'ad_user_data': granted ? 'granted' : 'denied', 
            'ad_personalization': granted ? 'granted' : 'denied',
            'analytics_storage': granted ? 'granted' : 'denied'
          });
        }
      }
    </script>
    <!-- End Meta Pixel Code -->
    
    <!-- Cookie Consent Banner -->
    <script>
      window.addEventListener("load", function(){
        if (typeof window.cookieconsent !== 'undefined') {
          window.cookieconsent.initialise({
            palette: {
              popup: { 
                background: "#000000",
                text: "#ffffff"
              },
              button: { 
                background: "#f2014b",
                text: "#ffffff"
              }
            },
            theme: "classic",
            position: "bottom",
            type: "opt-in",
            content: {
              message: "Utilizamos cookies para mejorar tu experiencia y personalizar contenido. Puedes aceptar solo las esenciales o todas, incluyendo las de marketing para ofrecerte información relevante sobre nuestros cursos.",
              dismiss: "Solo esenciales",
              allow: "Aceptar todas",
              link: "Política de cookies",
              href: "/politica-cookies"
            },
            onInitialise: function (status) {
              var type = this.options.type;
              var didConsent = this.hasConsented();
              if (type == 'opt-in' && didConsent) {
                // Activar servicios con consentimiento
                activateFacebookPixel();
                updateGoogleConsent(true);
                localStorage.setItem('marketing_consent', 'true');
              } else {
                // Solo cookies esenciales
                updateGoogleConsent(false);
                localStorage.setItem('marketing_consent', 'false');
              }
            },
            onStatusChange: function(status, chosenBefore) {
              var type = this.options.type;
              var didConsent = this.hasConsented();
              if (type == 'opt-in' && didConsent) {
                // Usuario acepta todas las cookies
                activateFacebookPixel();
                updateGoogleConsent(true);
                localStorage.setItem('marketing_consent', 'true');
              } else {
                // Usuario rechaza cookies de marketing
                updateGoogleConsent(false);
                localStorage.setItem('marketing_consent', 'false');
              }
            }
          });
        }
      });
    </script>
    <script async src="https://cdn.jsdelivr.net/npm/cookieconsent@3/build/cookieconsent.min.js"></script>
