<!DOCTYPE html>
<html lang="es">
  <head>
    <!-- Google tag (gtag.js) con Modo de Consentimiento v2 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-347NGFNZ90"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      
      // Configurar modo de consentimiento v2 por defecto (denegado)
      gtag('consent', 'default', {
        'ad_storage': 'denied',
        'ad_user_data': 'denied',
        'ad_personalization': 'denied',
        'analytics_storage': 'denied',
        'functionality_storage': 'granted',
        'personalization_storage': 'denied',
        'security_storage': 'granted',
        'wait_for_update': 500
      });
      
      gtag('js', new Date());
      gtag('config', 'G-347NGFNZ90', {
        'anonymize_ip': true,
        'allow_google_signals': false,
        'allow_ad_personalization_signals': false
      });
    </script>
    
    <!-- Google Tag Manager -->
    <script>(function(w,d,s,l,i){w[l]=w[l]||[];w[l].push({'gtm.start':
    new Date().getTime(),event:'gtm.js'});var f=d.getElementsByTagName(s)[0],
    j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';j.async=true;j.src=
    'https://www.googletagmanager.com/gtm.js?id='+i+dl;f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','GTM-5D4839F3');</script>
    <!-- End Google Tag Manager -->
    
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/images/logos/CIRCULO CEP FORMACION ICONO.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Content Security Policy - Permite tracking y APIs esenciales -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://formsubmit.co https://www.googletagmanager.com https://connect.facebook.net;
      connect-src 'self' https://formsubmit.co https://worldtimeapi.org https://www.google-analytics.com https://region1.google-analytics.com https://www.facebook.com;
      img-src 'self' data: https://www.facebook.com https://www.google-analytics.com;
      style-src 'self' 'unsafe-inline';
      font-src 'self';
      frame-src 'self' https://www.googletagmanager.com;
    ">
    
    <!-- Meta Description para SEO -->
    <meta name="description" content="Centro de Estudios Profesionales en Tenerife. Cursos Auxiliar Farmacia, Enfermería, Veterinaria, Quiromasaje. Matrícula desde 150€. Prácticas garantizadas. ¡Inscríbete ya!">
    
    <title>CEP FORMACIÓN - Centro de Estudios Profesionales en Tenerife</title>
    
    <!-- Meta Pixel Code -->
    <script>
      // Cargar el pixel base para detección pero sin tracking hasta consentimiento
      !function(f,b,e,v,n,t,s){
        if(f.fbq)return;n=f.fbq=function(){
          n.callMethod? n.callMethod.apply(n,arguments):n.queue.push(arguments)};
        if(!f._fbq)f._fbq=n;
        n.push=n; n.loaded=!0; n.version='2.0';
        n.queue=[]; t=b.createElement(e); t.async=!0;
        t.src=v; s=b.getElementsByTagName(e)[0];
        s.parentNode.insertBefore(t,s)
      }(window, document,'script','https://connect.facebook.net/en_US/fbevents.js');
      
      // Inicializar pixel pero sin tracking hasta consentimiento
      fbq('init', '1189071876088388', {}, { autoConfig: false, debug: false });
      
      function activateFacebookPixel() {
        // Solo activar tracking tras consentimiento
        if (typeof fbq !== 'undefined') {
          fbq('track', 'PageView');
          console.log('Facebook Pixel activated with consent');
        }
      }
      
      // Función para actualizar el consentimiento de Google (v2)
      function updateGoogleConsent(granted) {
        if (typeof gtag !== 'undefined') {
          gtag('consent', 'update', {
            'ad_storage': granted ? 'granted' : 'denied',
            'ad_user_data': granted ? 'granted' : 'denied', 
            'ad_personalization': granted ? 'granted' : 'denied',
            'analytics_storage': granted ? 'granted' : 'denied',
            'personalization_storage': granted ? 'granted' : 'denied'
          });
          
          // Actualizar configuración de Google Analytics
          gtag('config', 'G-347NGFNZ90', {
            'anonymize_ip': !granted,
            'allow_google_signals': granted,
            'allow_ad_personalization_signals': granted
          });
          
          // Enviar evento de consentimiento
          gtag('event', 'consent_update', {
            'consent_type': granted ? 'granted' : 'denied',
            'event_category': 'consent',
            'event_label': granted ? 'all_cookies' : 'essential_only'
          });
        }
      }
    </script>
    <!-- End Meta Pixel Code -->
    
    <!-- Banner de Cookies CSS Personalizado -->
    <style>
      #cookie-banner {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        background: linear-gradient(135deg, #000000 0%, #1a1a1a 100%);
        color: white;
        padding: 20px;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.3);
        z-index: 10000;
        transform: translateY(100%);
        transition: transform 0.3s ease-in-out;
        border-top: 3px solid #f2014b;
      }
      
      #cookie-banner.show {
        transform: translateY(0);
      }
      
      #cookie-banner .cookie-content {
        max-width: 1200px;
        margin: 0 auto;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 20px;
      }
      
      #cookie-banner .cookie-text {
        flex: 1;
        min-width: 300px;
        font-size: 14px;
        line-height: 1.5;
      }
      
      #cookie-banner .cookie-buttons {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }
      
      #cookie-banner button {
        padding: 12px 24px;
        border: none;
        border-radius: 25px;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s ease;
        font-size: 14px;
      }
      
      #cookie-banner .btn-accept {
        background: #f2014b;
        color: white;
      }
      
      #cookie-banner .btn-accept:hover {
        background: #d4013f;
        transform: translateY(-2px);
      }
      
      #cookie-banner .btn-essential {
        background: transparent;
        color: white;
        border: 2px solid #666;
      }
      
      #cookie-banner .btn-essential:hover {
        background: #666;
        border-color: #888;
      }
      
      @media (max-width: 768px) {
        #cookie-banner .cookie-content {
          flex-direction: column;
          text-align: center;
        }
        
        #cookie-banner .cookie-buttons {
          width: 100%;
          justify-content: center;
        }
        
        #cookie-banner button {
          flex: 1;
          min-width: 140px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Google Tag Manager (noscript) -->
    <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-5D4839F3"
    height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
    <!-- End Google Tag Manager (noscript) -->
    
    <!-- Meta Pixel (noscript) -->
    <noscript><img height="1" width="1" style="display:none"
    src="https://www.facebook.com/tr?id=1189071876088388&ev=PageView&noscript=1"/></noscript>
    <!-- End Meta Pixel (noscript) -->
    
    <!-- Banner de Cookies Personalizado -->
    <div id="cookie-banner">
      <div class="cookie-content">
        <div class="cookie-text">
          <strong>🍪 Utilizamos cookies para mejorar tu experiencia</strong><br>
          Usamos cookies esenciales para el funcionamiento del sitio y cookies de marketing para personalizar contenido y ofrecerte información relevante sobre nuestros cursos. Puedes elegir qué cookies aceptar.
        </div>
        <div class="cookie-buttons">
          <button class="btn-essential" onclick="acceptEssentialCookies()">Solo esenciales</button>
          <button class="btn-accept" onclick="acceptAllCookies()">Aceptar todas</button>
        </div>
      </div>
    </div>
    
    <script>
      // Gestión del banner de cookies
      function showCookieBanner() {
        const banner = document.getElementById('cookie-banner');
        const consent = localStorage.getItem('cookie_consent');
        
        if (!consent) {
          setTimeout(() => {
            banner.classList.add('show');
          }, 1000);
        } else {
          // Aplicar consentimiento guardado
          const marketingConsent = localStorage.getItem('marketing_consent') === 'true';
          updateGoogleConsent(marketingConsent);
          
          if (marketingConsent && typeof activateFacebookPixel === 'function') {
            activateFacebookPixel();
          }
        }
      }
      
      function hideCookieBanner() {
        const banner = document.getElementById('cookie-banner');
        banner.classList.remove('show');
      }
      
      function acceptAllCookies() {
        localStorage.setItem('cookie_consent', 'all');
        localStorage.setItem('marketing_consent', 'true');
        localStorage.setItem('consent_timestamp', new Date().toISOString());
        
        // Activar servicios con consentimiento
        if (typeof activateFacebookPixel === 'function') {
          activateFacebookPixel();
        }
        updateGoogleConsent(true);
        
        hideCookieBanner();
        console.log('✅ Todas las cookies aceptadas - Modo de consentimiento v2 actualizado');
      }
      
      function acceptEssentialCookies() {
        localStorage.setItem('cookie_consent', 'essential');
        localStorage.setItem('marketing_consent', 'false');
        localStorage.setItem('consent_timestamp', new Date().toISOString());
        
        // Solo cookies esenciales
        updateGoogleConsent(false);
        
        hideCookieBanner();
        console.log('✅ Solo cookies esenciales aceptadas - Modo de consentimiento v2 actualizado');
      }
      
      // Mostrar banner cuando la página cargue
      document.addEventListener('DOMContentLoaded', showCookieBanner);
      
      // Debug: Mostrar estado del consentimiento en consola
      window.addEventListener('load', function() {
        console.log('🔍 Estado del consentimiento:', {
          cookie_consent: localStorage.getItem('cookie_consent'),
          marketing_consent: localStorage.getItem('marketing_consent'),
          consent_timestamp: localStorage.getItem('consent_timestamp'),
          dataLayer: window.dataLayer
        });
      });
    </script>
    
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
